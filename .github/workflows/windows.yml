name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Renderer fixtures format dates in the product's time zone.
  TZ: Asia/Shanghai

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdfium2==4.30.0 Pillow==11.3.0
      - run: npm ci
      - run: npm run build:packages
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  package:
    name: Package and installer
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package:win
      - run: npm run make:win
      - name: Packaged app smoke test
        run: npx playwright test --config=playwright.electron.production.config.ts
      - name: Print failure page snapshots
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse test-results -Filter error-context.md -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "=== $($_.FullName)"
            Get-Content $_.FullName -TotalCount 80
          }
      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swpanel-windows-installers
          path: |
            installers/
            .scratch/*.json
          if-no-files-found: warn
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-production
          path: |
            playwright-report-production/
            test-results/
          if-no-files-found: ignore
